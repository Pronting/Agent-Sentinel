app:
  name: Agent Sentinel
  host: 0.0.0.0
  port: 8000
  env: dev
  log_level: INFO

llm:
  models:
    - gpt-4o-mini
    - gpt-3.5-turbo
  timeout_seconds: 15
  max_retries: 2
  mock_enabled: true

workflow:
  config_path: config/workflow.yaml
  node_timeout_seconds: 10
  human_confirm_timeout_seconds: 300
  human_confirm_enabled: true

tools:
  metrics_enabled: true
  logs_enabled: true
  topology_enabled: true

redis:
  url: redis://redis:6379/0
