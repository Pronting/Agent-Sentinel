app:
  name: Agent Sentinel
  host: 0.0.0.0
  port: 8000
  env: dev
  log_level: INFO

llm:
  models:
    - gpt-4o-mini
    - gpt-3.5-turbo
  timeout_seconds: 15
  max_retries: 2
  mock_enabled: true

workflow:
  config_path: config/workflow.yaml
  node_timeout_seconds: 10
  human_confirm_timeout_seconds: 300
  human_confirm_enabled: true

tools:
  provider: mock  # mock | aliyun
  metrics_enabled: true
  logs_enabled: true
  topology_enabled: true

  # 阿里云 SLS 日志服务配置
  aliyun_sls:
    access_key_id: ${ALIYUN_SLS_ACCESS_KEY_ID}
    access_key_secret: ${ALIYUN_SLS_ACCESS_KEY_SECRET}
    endpoint: cn-hangzhou.log.aliyuncs.com
    project: ""
    logstore: ""
    query_timeout_seconds: 10
    max_lines: 100

  # 阿里云 ARMS 应用监控配置
  aliyun_arms:
    access_key_id: ${ALIYUN_ARMS_ACCESS_KEY_ID}
    access_key_secret: ${ALIYUN_ARMS_ACCESS_KEY_SECRET}
    region_id: cn-hangzhou
    app_id: ""
    query_timeout_seconds: 10

redis:
  url: redis://redis:6379/0

rag:
  provider: mock
  final_top_k: 2
  mmr_lambda: 0.55
  static_docs:
    enabled: true
    collection: aiops_static_docs
    top_k: 2
    weight: 0.55
  message_history:
    enabled: true
    collection: aiops_message_history
    top_k: 2
    weight: 0.45
    default_days: 30
    case_cache_enabled: true
    case_cache_threshold: 0.85
    case_cache_top_k: 2
    feedback_enabled: true

embedding:
  model: text-embedding-3-small
  dimension: 1536
  mock_enabled: false
